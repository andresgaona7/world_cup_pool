<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cup Pool Score Visualizer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">World Cup 2026 Pool</p>
        <h1>Score Scenario Visualizer</h1>
      </div>
    </header>

    <main class="page">
      <section class="toolbar" aria-label="Score scenario">
        <label class="field scenario-select">
          <span>Score scenario</span>
          <select id="scenarioSelect">
            <option value="official">Official results</option>
            <option value="consensus">Consensus results</option>
          </select>
        </label>
      </section>

      <section class="metrics" id="metrics"></section>

      <section class="panel leaderboard-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Leaderboard</p>
            <h2>Score</h2>
          </div>
          <span class="rule-pill" id="leaderboardScenarioStatus">Consensus results</span>
        </div>
        <div class="table-wrap">
          <table id="leaderboardTable"></table>
        </div>
      </section>

      <section class="panel comparison-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Official vs Predictions</p>
            <h2>Results Comparison</h2>
          </div>
          <span class="rule-pill" id="comparisonStatus">Pending results</span>
        </div>
        <div id="comparisonSummary" class="comparison-summary"></div>
        <div class="comparison-content">
          <div class="comparison-block">
            <h3>Group Stage</h3>
            <div class="table-wrap">
              <table id="groupComparisonTable"></table>
            </div>
          </div>
          <div class="comparison-block">
            <h3>Best Thirds</h3>
            <div class="table-wrap">
              <table id="bestThirdComparisonTable"></table>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Rules</p>
            <h2>Group and Futures Scoring</h2>
          </div>
        </div>
        <div id="rulesGrid" class="rules-explainer"></div>
      </section>
    </main>

    <script src="../../data/generated/pool_data.js"></script>
    <script src="../../data/generated/official_results.js"></script>
    <script src="app.js"></script>
  </body>
</html>
