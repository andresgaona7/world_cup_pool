<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Cup Pool Reader</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">World Cup 2026 Pool</p>
        <h1>Player Predictions</h1>
      </div>
      <div class="header-tools">
        <nav class="site-nav" aria-label="Visualization navigation">
          <a href="../../index.html">Home</a>
          <a href="../rules/index.html">Rules</a>
          <a class="active" href="index.html" aria-current="page">Player Picks</a>
          <a href="../knockout_predictions/index.html">Knockout</a>
          <a href="../consensus_predictions/index.html">Consensus</a>
          <a href="../score_visualizer/index.html">Scores</a>
          <a href="../third_places/index.html">Third places</a>
          <a href="../score_timeline/index.html">Official results</a>
          <a href="../blog/index.html">Blog</a>
        </nav>
      </div>
    </header>

    <main class="layout">
      <section class="content" aria-live="polite">
        <div id="loadStatus" class="load-status" role="status">Loading player predictions...</div>

        <div class="player-heading">
          <div>
            <p class="eyebrow">Selected player</p>
            <h2 id="playerName"></h2>
          </div>
          <div class="player-heading-tools">
            <label class="player-select-control" for="playerSelect">
              <span>Player</span>
              <select id="playerSelect"></select>
            </label>
            <div id="sheetName" class="sheet-pill"></div>
          </div>
        </div>

        <section class="section">
          <h3>Futures</h3>
          <div id="futuresGrid" class="futures-grid"></div>
        </section>

        <section class="section">
          <h3>Group Stage</h3>
          <div class="table-wrap">
            <table id="firstRoundTable" class="first-round-table"></table>
          </div>
        </section>

        <section class="section">
          <h3>Best Thirds</h3>
          <div id="bestThirds" class="best-thirds"></div>
        </section>

        <section class="section">
          <h3>Round of 32</h3>
          <div id="knockoutRoundOf32" class="knockout-stage"></div>
        </section>

        <section class="section">
          <h3>Round of 16</h3>
          <div id="knockoutRoundOf16" class="knockout-stage"></div>
        </section>

        <section class="section">
          <h3>Quaterfinals</h3>
          <div id="knockoutQuarterfinal" class="knockout-stage"></div>
        </section>

        <section class="section">
          <h3>Semifinals</h3>
          <div id="knockoutSemifinal" class="knockout-stage"></div>
        </section>

        <section class="section">
          <h3>Final</h3>
          <div id="knockoutFinal" class="knockout-stage"></div>
        </section>
      </section>
    </main>

    <script src="../../data/generated/pool_data.js" onerror="window.POOL_DATA_LOAD_ERROR = true"></script>
    <script src="../../data/generated/knockout_predictions.js" onerror="window.KNOCKOUT_DATA_LOAD_ERROR = true"></script>
    <script src="app.js"></script>
  </body>
</html>
