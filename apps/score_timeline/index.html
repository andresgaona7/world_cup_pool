<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup Pool Score Timeline</title>
  <script src="../../theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="topbar">
    <div class="title-row">
      <div>
        <p class="eyebrow">World Cup 2026 Pool</p>
        <h1>Official Results</h1>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false"><span data-theme-toggle-label>Dark mode</span></button>
    </div>
    <nav class="site-nav" aria-label="Visualization navigation">
      <a href="../../index.html">Home</a>
      <a href="../rules/index.html">Rules</a>
      <a href="../player_predictions/index.html">Player Picks</a>
      <a href="../score_visualizer/index.html">Scores</a>
      <a href="../third_places/index.html">Third places</a>
      <a class="active" href="index.html" aria-current="page">Official results</a>
      <a href="../blog/index.html">Blog</a>
      <a href="../legacy/index.html">Legacy</a>
    </nav>
  </header>

  <main class="page">
    <section class="metrics" id="metrics" aria-label="Timeline summary"></section>

    <section class="panel chart-panel" id="chartPanel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">Official Checkpoints</p>
          <h2>Scores Timeline</h2>
        </div>
        <div class="chart-actions">
          <label class="range-control" for="chartWidthControl">
            <span>Width</span>
            <input id="chartWidthControl" type="range" min="85" max="180" value="100" step="5">
          </label>
          <span class="rule-pill" id="checkpointStatus">Pending results</span>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="timelineChart" class="timeline-chart" aria-live="polite"></div>
        <div id="timelineTooltip" class="tooltip" hidden></div>
      </div>
    </section>

    <section class="panel leaderboard-panel" id="leaderboardPanel">
      <div class="panel-head">
        <div>
          <!-- <p class="eyebrow">Checkpoint Detail</p> -->
          <h2>Leaderboard and Legend</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table id="leaderboardTable"></table>
      </div>
    </section>
  </main>

  <script src="../../data/generated/pool_data.js"></script>
  <script src="../../data/generated/official_results.js"></script>
  <script src="../../data/generated/knockout_predictions.js"></script>
  <script src="app.js"></script>
</body>

</html>
